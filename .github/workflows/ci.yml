name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Bau
        run: npm run build

      # Ohne KASSENECK_BACKEND (kein Backend-Checkout hier) ueberspringen
      # stored-backend.test.ts und der Backend-Teil von stored-zwillinge.test.ts;
      # beide laufen lokal mit KASSENECK_BACKEND=../kasseneck npm test.
      - name: Tests (drei Zeitzonen)
        run: npm test

      - name: Vertrag ist aktuell
        run: |
          npm run fixtures:kasse
          npm run fixtures:oberflaeche
          git diff --exit-code fixtures/ \
            || { echo "Standardwerte geaendert, Vertrag nicht mitgezogen — fixtures:* ausfuehren und mitcommitten"; exit 1; }

      - name: Orakel-Datei der Zufallsfaelle gegen die Python-Referenz
        run: |
          # scripts/rechnung-referenz.py braucht nur die Python-Standardbibliothek
          # (argparse, json, random, fractions, pathlib) — kein pip install noetig,
          # Python 3 liegt auf ubuntu-latest bereits bei.
          python3 --version
          python3 scripts/rechnung-referenz.py --pruefe fixtures/invoice-calc-random.json
          python3 scripts/rechnung-referenz.py --erzeuge --seed 20260918 --anzahl 400 \
            --ziel /tmp/invoice-calc-random-neu.json
          diff -u fixtures/invoice-calc-random.json /tmp/invoice-calc-random-neu.json \
            || { echo "fixtures/invoice-calc-random.json weicht von der aus demselben Seed neu erzeugten Datei ab — von Hand geaendert?"; exit 1; }

      # Nur der lokale Teil (Adressen und Aufrufe aus dem Bau, Ausnahmeliste);
      # der Netzteil laeuft taeglich in erreichbarkeit.yml.
      - name: Erreichbarkeit, lokaler Teil
        run: npm run check:erreichbar
        env:
          ERREICHBARKEIT_NUR_LOKAL: '1'

      - name: Verbraucherprobe am echten Tarball
        run: npm run check:consumer
