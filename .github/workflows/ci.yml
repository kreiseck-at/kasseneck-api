name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Bau
        run: npm run build

      - name: Tests (drei Zeitzonen)
        run: npm test

      - name: Verbraucherprobe am echten Tarball
        run: npm run check:consumer
